services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sherify_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Sherify Campaign Manager
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sherify
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CAMPAIGN_BATCH_SIZE=100
      - EMAIL_PROVIDER=mock
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-use-strong-random
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:8000", "http://localhost:80"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sherify_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    environment:
      - APP_NAME=Sherify Campaign Manager
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sherify
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CAMPAIGN_BATCH_SIZE=100
      - EMAIL_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sherify_beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      - APP_NAME=Sherify Campaign Manager
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sherify
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sherify_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sherify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sherify
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sherify"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sherify_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
